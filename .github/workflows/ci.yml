name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build phoneui
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_MODE=DMOD_MODULE
          cmake --build .

      - name: Verify module files
        run: |
          echo "Checking for module files..."
          ls -lh build/dmf/
          test -f build/dmf/phoneui.dmf
          test -f build/dmf/phoneui_view.dmf
          test -f build/dmf/phoneui_version.txt
          test -f build/views/epaper-240x320/phoneui.dmv
          test -f build/dmf/test_phoneui.dmf
          echo "Module files present"

      - name: Run tests with dmod_loader
        run: |
          export DMOD_DMF_DIR=$(pwd)/build/dmf
          dmf-get install -d ${DMOD_DMF_DIR}/test_phoneui-local.dmd -y
          dmod_loader build/dmf/test_phoneui.dmf

      - name: Tour of the pages (the real views, the stub backend)
        run: |
          # dmvshot: every touch opens what it should, every property the application sets exists in the view
          ctest --test-dir build --output-on-failure

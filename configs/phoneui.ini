; phoneui.ini - libsystemd unit: shows the interface of the phone on the first display while it runs (it waits for dmview to register
; the display). The view is the one built into the firmware (/eviews/phoneui_view/phoneui.dmv); give a path as the first argument
; (args=) to show another, the display's name as the second.
description=Graphical interface of the phone
exec=phoneui
type=simple
stop_timeout_ms=5000
